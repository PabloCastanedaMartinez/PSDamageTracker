# This file allows you to edit the template for the leaderboard format.
formats:
  # Player name format, you can use color codes, minimessage, symbols, etc. Use {name} to represent the player's name.
  name: "&e{name}"

  # Format for the damage dealt, you can use color codes, minimessage, symbols, etc. Use {damage} to represent the damage dealt.
  damage: "&c⚔{damage}"

  # Symbol to represent the player's position, you can use color codes, minimessage, symbols, etc.
  symbol: "&a>>"

# Full line format for the leaderboard, you can use color codes, minimessage, symbols, etc.
# Use {symbol} to represent the player's position.
# Use {name} to represent the player's name.
# Use {damage} to represent the damage dealt.
# Use {position} to represent the player's position.
format: "{symbol} {position}. {name}: {damage}"
# On this example, the leaderboard will look like this:
# >> 1. Player1: ⚔100.0
# >> 2. Player2: ⚔50.0